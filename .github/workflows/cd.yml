# =============================================================================
# Society Management and Logging System — Continuous Deployment
#
# Trigger: push to `main` (after CI passes) OR manual workflow_dispatch.
# Steps:
#   1. Build Docker images for all 5 NestJS services in parallel
#   2. Push to AWS ECR (tagged :sha + :latest / :staging)
#   3. Helm upgrade on EKS (rolling update, zero-downtime)
#
# Environment matrix:
#   staging    — triggered automatically on push to main
#   production — triggered manually via workflow_dispatch with confirmation
#
# Required GitHub secrets (repository level):
#   AWS_ACCOUNT_ID          — AWS account number (12 digits)
#   AWS_REGION              — e.g. ap-south-1
#   AWS_ROLE_ARN_STAGING    — IAM Role ARN with ECR push + EKS deploy perms (staging)
#   AWS_ROLE_ARN_PRODUCTION — IAM Role ARN with ECR push + EKS deploy perms (production)
#   EKS_CLUSTER_STAGING     — EKS cluster name for staging
#   EKS_CLUSTER_PRODUCTION  — EKS cluster name for production
#   HELM_VALUES_STAGING     — base64-encoded Helm values override for staging
#   HELM_VALUES_PRODUCTION  — base64-encoded Helm values override for production
# =============================================================================

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: cd-${{ github.ref }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false   # never cancel an in-flight deploy

env:
  NODE_VERSION: '22'
  # Services to build — order matches Helm chart dependency graph
  SERVICES: api-gateway owner-service admin-service super-admin-service media-service

jobs:
  # ── Determine target environment ────────────────────────────────────────────
  setup:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag:   ${{ steps.env.outputs.image_tag }}
    steps:
      - id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="staging"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ── Build & push Docker images to ECR ────────────────────────────────────────
  build-and-push:
    name: Build & push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.environment }}
    permissions:
      id-token: write   # required for OIDC → AWS role assumption
      contents: read
    strategy:
      matrix:
        service: [api-gateway, owner-service, admin-service, super-admin-service, media-service]
      fail-fast: false   # don't cancel other services if one fails

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: >-
            ${{
              needs.setup.outputs.environment == 'production'
              && secrets.AWS_ROLE_ARN_PRODUCTION
              || secrets.AWS_ROLE_ARN_STAGING
            }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx (multi-platform cache)
        uses: docker/setup-buildx-action@v3

      - name: Build and push — ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/society/${{ matrix.service }}:${{ needs.setup.outputs.image_tag }}
            ${{ steps.ecr-login.outputs.registry }}/society/${{ matrix.service }}:${{ needs.setup.outputs.environment == 'production' && 'latest' || 'staging' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            NODE_ENV=${{ needs.setup.outputs.environment }}

  # ── Helm upgrade on EKS ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to EKS (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [setup, build-and-push]
    environment: ${{ needs.setup.outputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: >-
            ${{
              needs.setup.outputs.environment == 'production'
              && secrets.AWS_ROLE_ARN_PRODUCTION
              || secrets.AWS_ROLE_ARN_STAGING
            }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          CLUSTER=${{
            needs.setup.outputs.environment == 'production'
            && secrets.EKS_CLUSTER_PRODUCTION
            || secrets.EKS_CLUSTER_STAGING
          }}
          aws eks update-kubeconfig --region "${{ secrets.AWS_REGION }}" --name "$CLUSTER"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.17.0'

      - name: Write Helm values override
        run: |
          VALUES_B64=${{
            needs.setup.outputs.environment == 'production'
            && secrets.HELM_VALUES_PRODUCTION
            || secrets.HELM_VALUES_STAGING
          }}
          echo "$VALUES_B64" | base64 -d > /tmp/values-override.yaml

      - name: Helm upgrade — all services (rolling update)
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG:     ${{ needs.setup.outputs.image_tag }}
          ENVIRONMENT:   ${{ needs.setup.outputs.environment }}
        run: |
          for SERVICE in api-gateway owner-service admin-service super-admin-service media-service; do
            echo "▶ Deploying $SERVICE..."
            helm upgrade "$SERVICE" ./helm/charts/"$SERVICE" \
              --install \
              --namespace "$ENVIRONMENT" \
              --create-namespace \
              --atomic \
              --timeout 5m \
              --set image.repository="$ECR_REGISTRY/society/$SERVICE" \
              --set image.tag="$IMAGE_TAG" \
              --set environment="$ENVIRONMENT" \
              -f /tmp/values-override.yaml
          done

      - name: Verify rollout
        run: |
          NAMESPACE="${{ needs.setup.outputs.environment }}"
          for SERVICE in api-gateway owner-service admin-service super-admin-service media-service; do
            kubectl rollout status deployment/"$SERVICE" -n "$NAMESPACE" --timeout=3m
          done

      - name: Post-deploy summary
        if: always()
        run: |
          echo "## Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ needs.setup.outputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag   | \`${{ needs.setup.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered   | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor       | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
