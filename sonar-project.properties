# =============================================================================
# SonarCloud project configuration
# Org / project key are populated via GitHub repository secrets:
#   SONAR_TOKEN   — generated in SonarCloud → My Account → Security
#   SONAR_ORG_ID  — the SonarCloud organisation slug
# =============================================================================

# ── Identity ─────────────────────────────────────────────────────────────────
# Replace the placeholders below with your actual SonarCloud values.
# These can also be passed as -D flags in the sonarcloud-github-action args.
sonar.organization=<YOUR_SONAR_ORG>
sonar.projectKey=<YOUR_SONAR_PROJECT_KEY>
sonar.projectName=Society Management and Logging System

# ── Sources ───────────────────────────────────────────────────────────────────
sonar.sources=applications,backend,packages
sonar.tests=applications,backend,packages

sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/test/**,\
  **/__tests__/**

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.tsbuildinfo,\
  **/packages/shared-ui-assets/assets/**

# ── Coverage ──────────────────────────────────────────────────────────────────
# Paths are relative to the repo root. The CI workflow downloads all
# per-package coverage reports to coverage-reports/ before the scan runs.
sonar.javascript.lcov.reportPaths=coverage-reports/**/lcov.info

# ── Language / encoding ───────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# TypeScript tsconfig — SonarCloud uses this for type resolution
sonar.typescript.tsconfigPaths=tsconfig.base.json
