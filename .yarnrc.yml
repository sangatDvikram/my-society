# =============================================================================
# Yarn Berry (4.x) configuration — Society Management and Logging System
# =============================================================================

# Path to the locally committed Yarn binary (checked in via .yarn/releases/)
yarnPath: .yarn/releases/yarn-4.14.1.cjs

# Use node_modules linker for full compatibility with:
#   - Next.js 15 (requires node_modules resolution for plugins + SWC)
#   - NestJS 10 (CommonJS decorators/metadata)
#   - React Native 0.74 / Expo (native module resolution)
#   - TypeORM (requires runtime entity glob patterns)
# PnP mode is intentionally NOT used — node-modules gives zero friction.
nodeLinker: node-modules

# Suppress Corepack warning (we commit the binary directly)
enableGlobalCache: false
